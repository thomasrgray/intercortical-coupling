[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intercortical-coupling"
version = "0.1.0"
description = "Figure-first analyses of orthonasal and retronasal GC-PC recordings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
phase = ["h5py>=3.8"]
spikes = ["h5py>=3.8", "hdf5plugin>=4.0"]

[project.scripts]
coupling-export-figure6 = "coupling.figure6:main"
coupling-spike-noise = "coupling.spike_coupling:main"
coupling-transition-corr = "coupling.transition_coupling:main"
coupling-phase-figure = "coupling.phase_coherence:main"
coupling-batch = "coupling.batch:main"
coupling-lfp-figure = "coupling.lfp_coupling:main"
coupling-respiration-lfp = "coupling.respiration_lfp:main"
coupling-check-adc = "coupling.adc_check:main"
coupling-respiration-qc = "coupling.respiration:main"
coupling-compare-power = "coupling.compare:main"
coupling-power = "coupling.power:main"
coupling-scan-dins = "coupling.events:main"
coupling-prepare = "coupling.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]
